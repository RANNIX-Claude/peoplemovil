    verificar_ui: "Listar las opciones visibles del combo"
    verificar_bd: |
      SELECT id, titulo FROM tc_tipos_movimiento_pedido WHERE tenant_id = '<tenant_id>';
    esperado_bd: "Comparar catálogo real contra lo mostrado; el legado ya marcó corrección aplicada — confirmar si persiste o si cambió de nombre (CAMBIO_NOMENCLATURA)."

  - n: 8
    paso_original: 8
    descripcion: Seleccionar Tipo de movimiento Servicio Interno
    esperado: "EL tipo Pedido se factura (validar posteriormente)"
    calidad: "RESUELTO — ver decision_negocio. Esperado original conservado sin editar (regla §1.6)."
    decision_negocio:
      fecha: "2026-10-11"
      autorizo: "roberto.aguilar.cota@gmail.com (usuario / negocio)"
      resolucion: >
        No es un bug de este paso. 'Validar posteriormente' indica que el caso original
        dejaba pendiente, para otro momento, probar el tipo de movimiento 'Pedido'
        (que sí factura) — no este paso, que elige 'Servicio Interno' a propósito.
        Para ESTE paso lo esperado real es que Servicio Interno NO facture, que es
        justo lo que ya observó el legado ('Factura determinado como No por default').
        Se abre tarea de backlog aparte para probar 'Pedido se factura' como caso propio
        (no se mezcla con ESC-03).
      esperado_vigente: "El tipo de movimiento 'Servicio Interno' queda marcado como no facturable por default."
    legado: { resultado: "No cumple", observacion: "Factura está determinado como de No por default", correccion: Corregido }
    accion: "Seleccionar la opción de tipo de movimiento equivalente a 'Servicio Interno'"
    verificar_ui: "Estado de facturable/no facturable mostrado en el formulario"
    verificar_bd: null

