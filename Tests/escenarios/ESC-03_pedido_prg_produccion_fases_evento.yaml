id: ESC-03
nombre: "Pedido PRG-Producción con complejidad y fase de evento"
version: 2
version_notas: >
  v2 (2026-10-11, autorizó roberto.aguilar.cota@gmail.com): resueltos los 3 puntos
  AMBIGUO de v1 (pasos 5, 8, 9) — ver campo decision_negocio en cada paso. El esperado
  original de cada paso se conserva sin editar (regla §1.6 METODOLOGIA_QA.md);
  el campo esperado_vigente dentro de decision_negocio es el que aplica para
  clasificar CUMPLE/NO CUMPLE de aquí en adelante.
fuente: "Dev/Tests/Plan_Pruebas_Freelance.xlsx / hoja ESC-03"
numero_original: "Escenario 3"
modulo: Pedidos
sesion_sugerida: S03
objetivo: >
  Validar un pedido PRG sin complejidad con varios detalles por fase de evento
  y arrastre de valores del detalle anterior.
funcionalidades:
  - Sin complejidad → solo Operativo
  - Catálogo PRG
  - Fases (Preparación, Montaje, Show, Desmontaje)
  - Nuevo bloque por fase
  - Valores heredados entre renglones del mismo producto
dependencias_datos: "—"
calidad_del_caso_excel: >
  Paso 5 marcado Cumple y No cumple a la vez; esperado dice 'UN de seguridad'
  (el caso real usa UN PRG). Paso 8: Tipo de movimiento 'Servicio Interno'
  con esperado redactado para 'Pedido'.
notas_originales: "—"

# Riesgos conocidos (de la corrida previa ESC-02, misma pantalla Pedidos/Pedido Detalle,
# ver Dev/Tests/corridas/2026-10-10_R1_ESC-02/bitacora.jsonl) — no se asumen como
# precondición cumplida, el qa-tester debe confirmarlos o refutarlos en Fase 0/2:
riesgos_conocidos:
  - "PEPs de la UN PRG no tenían, en la corrida ESC-02, ningún id_lugar_predeterminado
     ligado en tc_partidas_presupuestales (0 filas) — el paso 6 (autocompletar nombre/
     dirección del inmueble) podría repetir el mismo PARCIAL ya observado en ESC-02 paso 6."
  - "El combo 'Tipo de personal' mostró en ESC-02 los valores literales 'Personal
     freelance / eventual', 'Personal interno de oficina', 'Personal de planta' —
     no 'Staff'/'Operativo' como nombra el caso. Posible CAMBIO_NOMENCLATURA, no asumir
     equivalencia sin confirmarla en el paso 12."
  - "HALLAZGO CRÍTICO BLOQUEANTE en ESC-02 (paso 0, intento 4): el combo Producto del
     modal 'Agregar detalle al pedido' solo ofrece productos con tc_productos.id_puesto
     NULL; los productos reales con puesto ligado (matriciales, ej. los de PRG) no
     aparecen y el alta se bloquea en silencio. Si 'Técnico Audio PRG - IN' tiene
     id_puesto asignado, el paso 14 en adelante puede ser NO_EJECUTABLE por la misma
     causa raíz — verificar en BD antes de ejecutar (precondición crítica, no forzar
     con un producto sustituto sin avisar)."
  - "tc_tipos_complejidad (Migración 022) solo tiene 6 valores reales por aforo; no hay
     evidencia documentada de un valor catálogo literal 'No aplica'. El paso 9 pide
     'indicar que No Aplica' — confirmar si existe esa opción en el combo o si
     'sin complejidad' significa dejar tipo_complejidad_id en NULL sin seleccionar nada."

precondiciones:
  - "Cliente 'Ocesa Promotora, S.A. de C.V.' existe con al menos 1 contacto real en
     tc_contactos_cliente (confirmado en Migración 032 / ESC-02 paso 3: Laura Mendez
     Ruiz, tel. 5555123401)."
  - "Unidad de negocio 'PRG' existe con al menos 1 PEP (tc_partidas_presupuestales)
     vigente ligado a esa UN."
  - "Producto 'Técnico Audio PRG - IN' existe en tc_productos, vigente=true, ligado
     (vía tc_puestos) a la UN PRG — confirmar si tiene id_puesto asignado (ver
     riesgos_conocidos)."
  - "tc_fases_evento tiene los 5 valores reales de Lobo 2018: No aplica(0),
     Preparación(1), Montaje(2), Show(3), Desmontaje(4) — Migración 011."

