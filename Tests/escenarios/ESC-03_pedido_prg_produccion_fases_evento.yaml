    verificar_ui: "Campos Sitio/Inmueble y Lugar de cita se autocompletan con nombre y dirección reales"
    verificar_bd: |
      SELECT id_lugar_predeterminado FROM tc_partidas_presupuestales WHERE id = '<pep_id>';
      -- si no es NULL:
      SELECT nombre, direccion FROM tc_lugares_cita WHERE id = '<id_lugar_predeterminado>';
    esperado_bd: "id_lugar_predeterminado no NULL y el lugar tiene nombre/dirección reales — ver riesgos_conocidos, ESC-02 encontró PEPs de PRG sin este dato."
    precondicion_critica: true

  - n: 7
