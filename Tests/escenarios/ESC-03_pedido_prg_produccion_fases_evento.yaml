  - n: 5
    paso_original: 5
    descripcion: Seleccionar UN PRG
    esperado: "El sistema despliega los PEPS de la UN de seguridad, y la sociedad pagadora (en este caso Lobo)"
    calidad: "RESUELTO — ver decision_negocio. Esperado original conservado sin editar (regla §1.6)."
    decision_negocio:
      fecha: "2026-10-11"
      autorizo: "roberto.aguilar.cota@gmail.com (usuario / negocio)"
      resolucion: >
        Error de copy/paste en el caso original: el texto 'UN de seguridad' se copió de
        otro escenario de Seguridad. Este escenario siempre fue sobre UN PRG (confirmado
        por el título 'ESC-03 — Pedido PRG-Producción...' y por los pasos 12-32, todos
        de productos/fases PRG). No se cambia el flujo probado (sigue siendo UN PRG).
      esperado_vigente: "El sistema despliega los PEPs de la UN PRG, y la sociedad pagadora correspondiente."
    legado: { resultado: "Ambos marcados", observacion: "La sociedad pagadora por dafult está con ID 10", correccion: Corregido }
    accion: "Seleccionar 'PRG' en el combo Unidad de negocio"
    verificar_ui: "Combo PEP se llena con PEPs de la UN PRG; campo Sociedad pagadora refleja algún valor por default"
    verificar_bd: |
      SELECT id, titulo FROM tc_partidas_presupuestales
      WHERE unidad_negocio_id = '<un_prg_id>' AND activo = true;
    esperado_bd: "≥1 PEP vigente de la UN PRG, coincide con las opciones del combo."

