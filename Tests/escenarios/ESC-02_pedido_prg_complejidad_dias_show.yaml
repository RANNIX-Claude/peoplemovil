id: ESC-02
nombre: "Pedido PRG con complejidad y días de show"
version: 1
version_notas: >
  v1 (2026-10-11, autorizó roberto.aguilar.cota@gmail.com): primera conversión a YAML,
  hecha después de ejecutar la corrida (orden inverso al flujo normal §4 Fase 1→2 —
  esta corrida se ejecutó directo desde el Excel, ver Tests/corridas/2026-10-10_R1_ESC-02).
  Incluye ya resueltos H-002 (paso 7-8) y H-003 (paso 13) — ver decision_negocio en cada
  paso. El esperado original de cada paso se conserva sin editar (regla §1.6
  METODOLOGIA_QA.md); el campo esperado_vigente dentro de decision_negocio es el que
  aplica para clasificar CUMPLE/NO CUMPLE de aquí en adelante. H-005 (combo Producto vacío
  para Staff/PRG) y H-006 (buscador no encontraba pedidos antiguos) también se resolvieron,
  pero son defectos reales corregidos en código/datos, no decisiones de negocio sobre el
  caso — ver hallazgos.md para el detalle de esas dos correcciones.
fuente: "Dev/Tests/Plan_Pruebas_Freelance.xlsx / hoja ESC-02"
numero_original: "Escenario 2"
modulo: Pedidos
sesion_sugerida: S02
objetivo: >
  Validar un pedido PRG con complejidad y días de show: personal Staff, bloques por
  producto y presupuesto ligado a complejidad.
funcionalidades:
  - Complejidad
  - Duración en días de show
  - Tipo de personal Staff
  - Catálogo PRG
  - Jornada
  - Fase de evento
  - Bloques
  - Presupuesto día
dependencias_datos: "—"
calidad_del_caso_excel: >
  Paso 5 esperado dice "UN de seguridad" (copiado del Esc. 1, este caso siempre fue UN PRG).
  Paso 7 texto corrupto en el Excel ("movi+E10:F10miento"). Paso 8 selecciona Servicio Interno
  pero el esperado habla de "Pedido". Paso 18: "nos" probablemente es "no".
notas_originales: "—"

precondiciones:
  - "Cliente 'Ocesa Promotora, S.A. de C.V.' existe con al menos 1 contacto real en
     tc_contactos_cliente (Laura Mendez Ruiz, tel. 5555123401)."
  - "Unidad de negocio 'PRG' existe con al menos 1 PEP (tc_partidas_presupuestales)
     vigente ligado a esa UN."
  - "tc_tipos_complejidad tiene los 6 valores reales vigentes (Migración 022)."
  - "tp_sueldos_matriciales tiene tarifa real para al menos los puestos matriciales de
     PRG usados en la prueba (Migración 033, resuelve H-005 — antes 0 filas)."

datos_creados:
  pedido: { titulo_prefijo: "QA-{corrida}-ESC02" }
  nota: >
    Se crearon 2 pedidos de prueba: #199 (fecha_evento real del evento, 2018-09-01 —
    quedó invisible en listados por H-006, corregido) y #200 (fecha_evento futura,
    2026-12-21 — usado para continuar los pasos 13+ antes del fix de H-006). Ambos se
    dejaron en BD como evidencia, no se borraron.

