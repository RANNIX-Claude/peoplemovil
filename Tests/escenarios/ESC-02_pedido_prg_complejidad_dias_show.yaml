    decision_negocio:
      fecha: "2026-10-11"
      autorizo: "roberto.aguilar.cota@gmail.com (usuario / negocio)"
      resolucion: >
        H-002 (Tests/corridas/2026-10-10_R1_ESC-02/hallazgos.md): la UI real tiene 3
        opciones reales de tc_tipos_movimiento_pedido (Orden de servicio / Pedido
        facturable a cliente / Servicio interno), no 2. Se acepta como comportamiento
        válido — no se agrega una opción literal "Pedido" al catálogo.
      esperado_vigente: "El combo Tipo de movimiento muestra las 3 opciones reales vigentes de tc_tipos_movimiento_pedido."
    legado: { resultado: "No cumple", observacion: 'Únicamente muestra "pedido"', correccion: Corregido }
    r1: { resultado: "NO CUMPLE (reclasificado ACEPTADO)", observacion: 'H-002: UI real muestra 3 tipos (Orden de servicio / Pedido facturable a cliente / Servicio interno); ninguno se llama "Pedido" literal.' }
    accion: "Abrir el combo Tipo de movimiento"
    verificar_ui: "Listar las opciones visibles del combo"
    verificar_bd: |
      SELECT id, titulo FROM tc_tipos_movimiento_pedido WHERE tenant_id = '<tenant_id>';

