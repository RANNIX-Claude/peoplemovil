      autorizo: "roberto.aguilar.cota@gmail.com (usuario / negocio)"
      resolucion: >
        H-002: no existe un campo "Facturable" separado editable — el estado va
        embebido en el texto de la opción elegida ("Servicio interno (no factura)").
        Se acepta: no se agrega un campo Facturable aparte. Validar "Pedido se factura"
        queda fuera de alcance de ESC-02 (otro tipo de movimiento, otro caso).
      esperado_vigente: "Al elegir 'Servicio interno (no factura)' el pedido queda no facturable; no hay campo Facturable separado."
    legado: { resultado: "No cumple", observacion: "Al no poder seleccionar el tipo de movimiento no sabemos si afecta en el procedimiento. Nos aparece que no es facturable, pero se puede cambiar.", correccion: Corregido }
    r1: { resultado: "PARCIAL (reclasificado ACEPTADO)", observacion: 'H-002: "Facturable" va embebido en el texto de la opción elegida; no existe un campo separado editable.' }
    accion: "Seleccionar la opción 'Servicio interno (no factura)'"
